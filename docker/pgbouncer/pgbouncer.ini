; ════════════════════════════════════════════════════════════════
; EraySame Tech Academy — Enterprise PgBouncer Proxy Configuration
; ════════════════════════════════════════════════════════════════
; Optimized for dedicated managed PostgreSQL (AWS RDS / GCP Cloud SQL)
; Mode: transaction pooling (multiplexes 10,000+ client connections down to 20-50 DB connections)

[databases]
academy_db = host=db port=5432 dbname=academy_db user=app_user password=dev_secret

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin

; Connection Pooling Limits
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5

; Connection Timeouts & Timeouts Protection
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 30
client_idle_timeout = 60
server_idle_timeout = 300

; Logging & Statistics
stats_period = 60
verbose = 0
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
